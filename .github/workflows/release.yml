name: Release

# 打 tag（v1.3.2 这种）时自动出三端安装包并发布 Release。
# 也可以在 Actions 页面手动运行：只构建、上传为 workflow artifact，不发布。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS（universal）
    # 别写死 macos-14：这个标签在部分仓库会被解析成不存在的 arm64 runner 配置
    # （报 "The configuration 'macos-14-arm64-us-default' is not supported"），
    # 任务会在 1 秒内失败。macos-latest 与 ci.yml 保持一致。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 dmgbuild
        run: python3 -m pip install --break-system-packages dmgbuild

      - name: 编译并打包（脚本会 lipo 成 universal，再出 dmg）
        run: |
          command -v dmgbuild >/dev/null || { echo "dmgbuild 不可用"; exit 1; }
          bash build.sh

      - name: 校验
        run: |
          lipo -archs build/GlassMC.app/Contents/MacOS/GlassMC
          codesign --verify --deep --strict build/GlassMC.app
          ls -lh build/GlassMC.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/GlassMC.dmg
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux（deb + tar.gz）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      - name: 编译
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: 编译并打包
        run: bash Scripts/make-linux-package.sh

      - name: 校验
        run: |
          BIN=$(ls build/linux/glassmc_*/usr/bin/glassmc | head -1)
          missing=$(ldd "$BIN" | grep "not found" || true)
          if [ -n "$missing" ]; then echo "缺库：$missing"; exit 1; fi
          dpkg-deb -I build/linux/*.deb | head -20
          ls -lh build/linux/*.deb build/linux/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/linux/*.deb
            build/linux/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows（exe）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 编译
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: 打安装包
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          mkdir -p build/windows
          ls -lh src-tauri/target/release/ | head -20
          cp -v src-tauri/target/release/glassmc.exe build/windows/
          cp src-tauri/target/release/WebView2Loader.dll build/windows/ 2>/dev/null \
            || echo "警告：没找到 WebView2Loader.dll，装到没有 WebView2 的机器上会起不来"
          ls -lh build/windows/
          # makensis 是原生程序，路径统一转成 C:\ 形式，Git Bash 的 /d/... 它不认
          makensis \
            -DEXE_PATH="$(cygpath -w "$PWD/build/windows/glassmc.exe")" \
            -DICON_PATH="$(cygpath -w "$PWD/src-tauri/icons/icon.ico")" \
            -DEXTRA_DIR="$(cygpath -w "$PWD/build/windows")" \
            -DOUTFILE="$(cygpath -w "$PWD/build/windows/GlassMC-Setup.exe")" \
            Scripts/windows-installer.nsi
          ls -lh build/windows/GlassMC-Setup.exe
          ls -lh build/windows/GlassMC-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/GlassMC-Setup.exe
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- 发布
  publish:
    name: 发布 Release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 统一文件名
        run: |
          set -e
          cd dist
          # 各 job 产出的文件名不统一，这里归一。目标名已存在时跳过，
          # 否则 mv 会因为「源和目标是同一个文件」直接失败。
          [ -f GlassMC.dmg ] || mv ./*.dmg GlassMC.dmg
          [ -f GlassMC-Setup.exe ] || mv ./*.exe GlassMC-Setup.exe
          [ -f GlassMC.deb ] || mv ./*_amd64.deb GlassMC.deb
          [ -f GlassMC-linux.tar.gz ] || mv ./*linux-amd64.tar.gz GlassMC-linux.tar.gz
          ls -lh
          sha256sum GlassMC.dmg GlassMC-Setup.exe GlassMC.deb GlassMC-linux.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 检查 tag 与版本号是否一致
        run: |
          v="${GITHUB_REF_NAME#v}"
          conf=$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          echo "tag=$v  版本=$conf"
          [ "$v" = "$conf" ] || { echo "tag 与 tauri.conf.json 的版本号不一致"; exit 1; }

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 中文发布说明放在 .github/release-notes/<tag>.md（例如 v1.3.3.md）；
          # 找不到就退回自动生成，保证没有 notes 文件的 tag 也能发出去。
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          FILES=(dist/GlassMC.dmg dist/GlassMC-Setup.exe \
                 dist/GlassMC.deb dist/GlassMC-linux.tar.gz dist/SHA256SUMS.txt)
          if [ -f "$NOTES" ]; then
            echo "使用 $NOTES 作为发布说明"
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "GlassMC ${GITHUB_REF_NAME#v}" --notes-file "$NOTES"
          else
            echo "未找到 $NOTES，回退 --generate-notes"
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "GlassMC ${GITHUB_REF_NAME#v}" --generate-notes
          fi
