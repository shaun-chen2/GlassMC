name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  # PR 不做路径过滤：main 要求检查必须变绿才能合并，
  # 一旦跳过，纯文档 PR 会永远卡在 "Expected — Waiting for status"。
  pull_request:
  workflow_dispatch:

# 同一个分支连续 push 时，取消上一轮还在跑的检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: 格式 · Clippy · 一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 版本号是否一致
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          conf = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())["version"]
          cargo = re.search(r'^version\s*=\s*"([^"]+)"',
                            pathlib.Path("src-tauri/Cargo.toml").read_text(),
                            re.M).group(1)
          nsi = re.search(r'PRODUCT_VERSION\s+"([^"]+)"',
                          pathlib.Path("Scripts/windows-installer.nsi").read_text()).group(1)
          mock = re.search(r"version:\s*'([^']+)'",
                           pathlib.Path("src/js/app.js").read_text()).group(1)

          # build.sh 从 tauri.conf.json 读版本，不参与比较
          pairs = {"tauri.conf.json": conf, "Cargo.toml": cargo,
                   "windows-installer.nsi": nsi, "app.js(mock)": mock}
          print(pairs)
          if len(set(pairs.values())) != 1:
              sys.exit("版本号不一致：" + ", ".join(f"{k}={v}" for k, v in pairs.items()))
          PY

      - name: 前端脚本语法
        run: for f in src/js/*.js src/vendor/*.js; do node --check "$f"; done

  build:
    name: 编译 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: Linux   }
          - { os: macos-latest,   name: macOS   }
          - { os: windows-latest, name: Windows }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --locked

      - name: 报告产物
        shell: bash
        run: |
          ls -lh src-tauri/target/debug/glassmc* 2>/dev/null || true
