[package]
name = "glassmc"
version = "1.3.0"
description = "GlassMC — 原生液态玻璃 Minecraft 启动器（跨平台）"
edition = "2021"
rust-version = "1.85"

[lib]
name = "glassmc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "7.0.0"
md5 = "0.8.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "gzip", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10.7"
sha2 = "0.10.9"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.53.3", features = ["full"] }
zip = "4.2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8.1"
